version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: equigrade_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_placeholder}
      POSTGRES_DB: ${POSTGRES_DB:-equigrade}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: equigrade_web
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 1409 --reload
    ports:
      - "1409:1409"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://postgres:postgres_password_placeholder@db:5432/equigrade}
      - SECRET_KEY=${SECRET_KEY:-CHANGE_THIS_TO_A_SECURE_RANDOM_SECRET_KEY_32_BYTES_MIN}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REFRESH_TOKEN_EXPIRE_DAYS=30
      - SESSION_IDLE_TIMEOUT_MINUTES=120
    depends_on:
      - db

volumes:
  pgdata:
