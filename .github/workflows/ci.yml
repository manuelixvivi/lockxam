name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 3sekawancinta@magot!!
          POSTGRES_DB: equigrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black ruff mypy Faker pre-commit pytest-cov httpx

      - name: Run Black formatter check
        run: black --check .

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Mypy static type checker
        run: mypy .

      - name: Run Pytest suite with Coverage
        env:
          DATABASE_URL: postgresql+psycopg://postgres:3sekawancinta%40magot!!@localhost:5432/equigrade
          SECRET_KEY: shush2_a2m2USEA_246f_e92s_ccbd_246_expa1783390714
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          REFRESH_TOKEN_EXPIRE_DAYS: 30
          SESSION_IDLE_TIMEOUT_MINUTES: 120
        run: pytest -v
