[project]
name = "equigrade-lockxam"
version = "1.0.0"
description = "Equigrade x Lockxam Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0,<1.0.0",
    "uvicorn>=0.20.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0",
    "SQLAlchemy>=2.0.0,<3.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.11.0",
    "bcrypt>=4.0.0",
    "cryptography>=41.0.0",
    "python-jose>=3.3.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "boto3>=1.34.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["frontend*", "tests*", "uploads*", "migrations*", "backend_ai*", "api*", "runs*", "tmp_s3_staging*", "documentation*", "docs*"]


[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (black takes care of this)
    "E712",  # Avoid equality comparisons to False (SQLAlchemy expression comparison needs == False)
    "B008",  # Do not perform function call Depends in argument defaults (required by FastAPI)
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "silent"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "jose.*",
    "passlib.*",
    "faker.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
