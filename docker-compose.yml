version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: equigrade_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 3sekawancinta@magot!!
      POSTGRES_DB: equigrade
